name: Publish benchmark results

on:
  push:
    branches: [main]
    paths:
      - 'results-page/**'
      - 'config/benchmark.json'
      - 'cases/**'
      - 'lib/eab/results.ex'
      - 'lib/eab/results/**'
      - 'lib/eab/model_identity.ex'
      - 'lib/mix/tasks/eab.results.ex'
      - 'test/eab/results_test.exs'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/results-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ERL_FLAGS: '+S 2:2'
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Install Elixir dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Check result publication rules
        run: mix test test/eab/results_test.exs --warnings-as-errors --max-cases 2
      - name: Build the static page
        run: mix eab.results build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: results-page/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
