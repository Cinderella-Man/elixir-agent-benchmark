name: Publish benchmark results

on:
  push:
    branches: [main]
    paths:
      - 'results-page/**'
      - 'config/benchmark.json'
      - 'cases/**'
      - 'scripts/model_resources.py'
      - '.github/workflows/results-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check result publication rules
        run: python3 -m unittest discover -s results-page -p 'test_*.py'
      - name: Build the static page
        run: python3 results-page/publish.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: results-page/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
