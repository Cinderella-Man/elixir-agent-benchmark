services:
  benchmark:
    image: elixir-agent-benchmark:local
    build: .
    init: true
    network_mode: host
    environment:
      PORT: ${PORT:-4000}
      EAB_PREPARE_AHEAD: ${EAB_PREPARE_AHEAD:-4}
      EAB_PREPARE_WORKERS: ${EAB_PREPARE_WORKERS:-2}
    volumes:
      - benchmark-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  benchmark-data:
